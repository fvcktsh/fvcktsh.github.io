<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Studio Compiler OS</title>

<style>
body{
  margin:0;
  font-family: ui-monospace, monospace;
  background:#0b0b0b;
  color:#eaeaea;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns:260px 1fr 300px;
  height:100vh;
}

/* LEFT */
#left{
  border-right:1px solid #222;
  padding:10px;
}

.btn{
  padding:8px;
  border:1px solid #333;
  margin-bottom:6px;
  cursor:pointer;
}
.btn:hover{ background:#111; }

/* CENTER */
#center{
  position:relative;
}

.node{
  position:absolute;
  width:140px;
  padding:10px;
  background:#111;
  border:1px solid #333;
  cursor:move;
}

/* RIGHT */
#right{
  border-left:1px solid #222;
  padding:10px;
}

button{
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#111;
  border:1px solid #333;
  color:#fff;
  cursor:pointer;
}

canvas{
  position:absolute;
  width:100%;
  height:100%;
}

</style>
</head>

<body>

<div id="app">

<!-- LEFT PANEL -->
<div id="left">

<div class="btn" onclick="addNode('GRID')">GRID</div>
<div class="btn" onclick="addNode('ATTRACTOR')">ATTRACTOR</div>
<div class="btn" onclick="addNode('EXTRUDE')">EXTRUDE</div>

<div class="btn" onclick="compile()">COMPILE</div>

</div>

<!-- CENTER -->
<div id="center">
<canvas id="c"></canvas>
</div>

<!-- RIGHT -->
<div id="right">

<h3>EXPORT</h3>

<button onclick="exportJSON()">EXPORT JSON</button>
<button onclick="exportDXF()">EXPORT DXF</button>
<button onclick="exportSTL()">EXPORT STL</button>

</div>

</div>

<script>

/* =========================
   DATA MODEL
========================= */

let nodes = [];
let geometry = [];

/* =========================
   ADD NODE
========================= */

function addNode(type){

  const n = document.createElement("div");
  n.className = "node";
  n.innerHTML = type;

  n.style.left = Math.random()*300+"px";
  n.style.top = Math.random()*200+"px";

  document.getElementById("center").appendChild(n);

  nodes.push({type, el:n});

  drag(n);
}

/* =========================
   DRAG
========================= */

function drag(el){

  let dx,dy,drag=false;

  el.onmousedown=(e)=>{
    drag=true;
    dx=e.offsetX;
    dy=e.offsetY;
  };

  document.onmousemove=(e)=>{
    if(drag){
      el.style.left=(e.pageX-dx)+"px";
      el.style.top=(e.pageY-dy)+"px";
    }
  };

  document.onmouseup=()=>drag=false;
}

/* =========================
   COMPILER CORE
========================= */

function compile(){

  geometry = [];

  let size = 150;
  let density = 10;

  for(let x=0;x<size;x+=density){
    for(let y=0;y<size;y+=density){

      let px = x;
      let py = y;
      let pz = 0;

      // simple attractor logic
      let cx = 75, cy = 75;

      let dx = cx - px;
      let dy = cy - py;

      let d = Math.sqrt(dx*dx + dy*dy);
      let f = 50/(d+1);

      px += dx*f*0.02;
      py += dy*f*0.02;
      pz = Math.sin(d*0.1)*10;

      geometry.push([px,py,pz]);
    }
  }

  render();
}

/* =========================
   RENDER
========================= */

function render(){

  const c = document.getElementById("c");
  const ctx = c.getContext("2d");

  c.width = window.innerWidth;
  c.height = window.innerHeight;

  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="#fff";

  geometry.forEach(p=>{
    ctx.fillRect(p[0],p[1],2,2);
  });

}

/* =========================
   EXPORT SYSTEM
========================= */

function exportJSON(){

  download("geometry.json", JSON.stringify(geometry));
}

function exportDXF(){

  let dxf = "0\nSECTION\n2\nENTITIES\n";

  geometry.forEach((p,i)=>{

    if(i<geometry.length-1){

      let a = geometry[i];
      let b = geometry[i+1];

      dxf += `
0
LINE
10 ${a[0]}
20 ${a[1]}
30 0
11 ${b[0]}
21 ${b[1]}
31 0
`;
    }
  });

  dxf += "0\nENDSEC\n0\nEOF";

  download("model.dxf", dxf);
}

function exportSTL(){

  let stl = "solid studio\n";

  geometry.forEach(p=>{

    stl += `
facet normal 0 0 1
outer loop
vertex ${p[0]} ${p[1]} ${p[2]}
vertex ${p[0]+1} ${p[1]} ${p[2]}
vertex ${p[0]} ${p[1]+1} ${p[2]}
endloop
endfacet
`;
  });

  stl += "endsolid";

  download("model.stl", stl);
}

/* =========================
   DOWNLOAD
========================= */

function download(name,data){
  let b = new Blob([data],{type:"text/plain"});
  let u = URL.createObjectURL(b);
  let a = document.createElement("a");
  a.href=u;
  a.download=name;
  a.click();
}

</script>

</body>
</html>
