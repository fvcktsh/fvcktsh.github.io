<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parametric City 3D Lab</title>

<style>
body { margin:0; overflow:hidden; background:#050505; font-family:Arial; }
#ui {
  position:fixed;
  top:20px;
  left:20px;
  color:#aaa;
  z-index:10;
  font-size:12px;
  letter-spacing:0.2em;
}
</style>

</head>

<body>

<div id="ui">
PARAMETRIC CITY / COMPUTATIONAL STUDIO<br>
WASD + MOUSE TO NAVIGATE
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================
   SCENE SETUP
========================= */

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 50, 200);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

camera.position.set(0,20,60);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* =========================
   LIGHT
========================= */

const light = new THREE.PointLight(0xffffff, 1);
light.position.set(50,50,50);
scene.add(light);

/* =========================
   CITY GENERATION
========================= */

const buildings = [];

function createBuilding(x,z,type){

  const height = Math.random()*20 + 5;

  const geometry = new THREE.BoxGeometry(2, height, 2);

  let color = 0x888888;

  if(type==="project") color = 0xffffff;
  if(type==="research") color = 0x6666ff;
  if(type==="system") color = 0x66ff99;

  const material = new THREE.MeshStandardMaterial({
    color:color,
    wireframe:false
  });

  const mesh = new THREE.Mesh(geometry, material);

  mesh.position.set(x, height/2, z);

  scene.add(mesh);

  buildings.push(mesh);
}

/* =========================
   GENERATE CITY GRID
========================= */

const types = ["project","research","system"];

for(let i=0;i<120;i++){

  const x = (Math.random()-0.5)*200;
  const z = (Math.random()-0.5)*200;

  const type = types[Math.floor(Math.random()*3)];

  createBuilding(x,z,type);
}

/* =========================
   CAMERA CONTROLS SIMPLE
========================= */

let keys = {};

document.addEventListener("keydown",(e)=>keys[e.key]=true);
document.addEventListener("keyup",(e)=>keys[e.key]=false);

function updateCamera(){

  if(keys["w"]) camera.position.z -= 0.5;
  if(keys["s"]) camera.position.z += 0.5;
  if(keys["a"]) camera.position.x -= 0.5;
  if(keys["d"]) camera.position.x += 0.5;

}

/* =========================
   ANIMATION LOOP
========================= */

function animate(){

  requestAnimationFrame(animate);

  updateCamera();

  /* subtle breathing motion (generative feel) */
  buildings.forEach((b,i)=>{
    b.position.y += Math.sin(Date.now()*0.001 + i)*0.01;
  });

  renderer.render(scene, camera);
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
