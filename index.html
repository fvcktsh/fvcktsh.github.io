<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Computational Fabrication Lab</title>

<style>

body{
  margin:0;
  font-family: monospace;
  background:#0b0b0b;
  color:#eee;
  display:flex;
  height:100vh;
}

/* =========================
   NODE PANEL
========================= */

#left{
  width:240px;
  border-right:1px solid #222;
  padding:10px;
}

.nodeBtn{
  border:1px solid #333;
  padding:8px;
  margin-bottom:6px;
  cursor:pointer;
}

.nodeBtn:hover{
  background:#111;
}

/* =========================
   CANVAS
========================= */

#center{
  flex:1;
  position:relative;
}

svg{
  width:100%;
  height:100%;
  background:#0b0b0b;
}

/* =========================
   PARAMS
========================= */

#right{
  width:260px;
  border-left:1px solid #222;
  padding:10px;
}

input{
  width:100%;
}

</style>
</head>

<body>

<!-- LEFT -->
<div id="left">

<div class="nodeBtn" onclick="addNode('GRID')">GRID</div>
<div class="nodeBtn" onclick="addNode('ATTRACTOR')">ATTRACTOR</div>
<div class="nodeBtn" onclick="addNode('SCALE')">SCALE</div>
<div class="nodeBtn" onclick="generate()">GENERATE</div>
<div class="nodeBtn" onclick="exportSVG()">EXPORT SVG</div>

</div>

<!-- CENTER -->
<div id="center">
<svg id="svg"></svg>
</div>

<!-- RIGHT -->
<div id="right">

<h3>PARAMETERS</h3>

Density
<input id="density" type="range" min="5" max="40" value="20">

Attraction
<input id="attraction" type="range" min="0" max="200" value="100">

Scale
<input id="scale" type="range" min="1" max="20" value="8">

</div>

<script>

/* =========================
   NODE SYSTEM (SIMPLIFIED GRASSHOPPER)
========================= */

let nodes = [];

function addNode(type){
  nodes.push({type});
}

/* =========================
   COMPUTATION CORE
========================= */

function generate(){

  const svg = document.getElementById("svg");
  svg.innerHTML = "";

  const density = document.getElementById("density").value;
  const attraction = document.getElementById("attraction").value;
  const scale = document.getElementById("scale").value;

  let points = [];

  /* GRID */
  for(let x=0;x<400;x+=density){
    for(let y=0;y<400;y+=density){

      let px = x;
      let py = y;

      /* ATTRACTOR */
      const cx = 200;
      const cy = 200;

      let dx = cx - px;
      let dy = cy - py;
      let d = Math.sqrt(dx*dx + dy*dy);

      let force = attraction / (d+1);

      px += dx * force * 0.01;
      py += dy * force * 0.01;

      points.push({x:px, y:py});
    }
  }

  /* DRAW */
  points.forEach(p=>{

    let rect = document.createElementNS("http://www.w3.org/2000/svg","rect");

    rect.setAttribute("x",p.x);
    rect.setAttribute("y",p.y);
    rect.setAttribute("width",scale);
    rect.setAttribute("height",scale);
    rect.setAttribute("fill","#ddd");

    svg.appendChild(rect);
  });

}

/* =========================
   EXPORT SVG (FABRICATION)
========================= */

function exportSVG(){

  const svg = document.getElementById("svg");
  const data = new XMLSerializer().serializeToString(svg);

  const blob = new Blob([data], {type:"image/svg+xml"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "fabrication.svg";
  a.click();
}

</script>

</body>
</html>
