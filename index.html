<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Studio Operating System</title>

<style>

/* =========================
   CORE SYSTEM UI
========================= */

body{
  margin:0;
  font-family: monospace;
  background:#0b0b0b;
  color:#eaeaea;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns:260px 1fr 320px;
  height:100vh;
}

/* =========================
   NODE LIBRARY
========================= */

#left{
  border-right:1px solid #222;
  padding:10px;
}

.node{
  padding:8px;
  border:1px solid #333;
  margin-bottom:6px;
  cursor:pointer;
}

.node:hover{
  background:#111;
}

/* =========================
   CANVAS (COMPUTATIONAL SPACE)
========================= */

#center{
  position:relative;
  background:#0b0b0b;
}

canvas{
  width:100%;
  height:100%;
}

/* =========================
   STUDIO MEMORY PANEL
========================= */

#right{
  border-left:1px solid #222;
  padding:10px;
}

.section{
  margin-bottom:20px;
  font-size:12px;
}

button{
  width:100%;
  margin-top:8px;
  padding:8px;
  background:#111;
  color:#ddd;
  border:1px solid #333;
  cursor:pointer;
}

button:hover{
  background:#1a1a1a;
}

input{
  width:100%;
}

</style>

</head>

<body>

<div id="app">

<!-- LEFT NODE SYSTEM -->
<div id="left">

<div class="node" onclick="setMode('grid')">GEOMETRY GRID</div>
<div class="node" onclick="setMode('field')">ATTRACTOR FIELD</div>
<div class="node" onclick="setMode('subdivision')">SUBDIVISION</div>
<div class="node" onclick="setMode('fabric')">FABRICATION</div>

</div>

<!-- CENTER ENGINE -->
<div id="center">
<canvas id="c"></canvas>
</div>

<!-- RIGHT STUDIO MEMORY -->
<div id="right">

<div class="section">
<h3>PARAMETERS</h3>

Density
<input id="density" type="range" min="5" max="50" value="20">

Force
<input id="force" type="range" min="0" max="200" value="80">

Depth
<input id="depth" type="range" min="0" max="100" value="30">
</div>

<div class="section">
<h3>FABRICATION</h3>

<button onclick="generate()">GENERATE SYSTEM</button>
<button onclick="exportSVG()">EXPORT SVG (LASER)</button>
<button onclick="exportOBJ()">EXPORT OBJ (3D PRINT)</button>
</div>

<div class="section">
<h3>STUDIO MEMORY</h3>
<div id="log">SYSTEM READY</div>
</div>

</div>

</div>

<script>

/* =========================
   CORE STATE
========================= */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mode = "grid";
let points = [];

function setMode(m){
  mode = m;
  log("MODE: " + m);
}

function log(t){
  document.getElementById("log").innerText = t;
}

/* =========================
   COMPUTATIONAL ENGINE
========================= */

function generate(){

  points = [];

  const d = +document.getElementById("density").value;
  const f = +document.getElementById("force").value;
  const depth = +document.getElementById("depth").value;

  const cx = canvas.width/2;
  const cy = canvas.height/2;

  for(let x=0;x<canvas.width;x+=d){
    for(let y=0;y<canvas.height;y+=d){

      let px = x;
      let py = y;

      if(mode === "field"){

        let dx = cx - px;
        let dy = cy - py;

        let dist = Math.sqrt(dx*dx + dy*dy);
        let force = f/(dist+1);

        px += dx*force*0.02;
        py += dy*force*0.02;
      }

      if(mode === "subdivision"){

        px += Math.sin(x*0.02)*5;
        py += Math.cos(y*0.02)*5;
      }

      points.push({x:px,y:py,z:depth});
    }
  }

  draw();
  log("SYSTEM GENERATED: " + points.length + " NODES");
}

/* =========================
   RENDER
========================= */

function draw(){

  ctx.fillStyle = "#0b0b0b";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#ddd";

  points.forEach(p=>{
    ctx.fillRect(p.x,p.y,2,2);
  });

}

/* =========================
   FABRICATION EXPORT
========================= */

function exportSVG(){

  let svg = `<svg xmlns="http://www.w3.org/2000/svg">`;

  points.forEach(p=>{
    svg += `<rect x="${p.x}" y="${p.y}" width="1" height="1" fill="black"/>`;
  });

  svg += `</svg>`;

  download("fabrication.svg", svg);

  log("EXPORTED SVG");
}

function exportOBJ(){

  let obj = "";

  points.forEach(p=>{
    obj += `v ${p.x} ${p.y} ${p.z}\n`;
  });

  download("fabrication.obj", obj);

  log("EXPORTED OBJ");
}

/* =========================
   DOWNLOAD ENGINE
========================= */

function download(name,data){
  const blob = new Blob([data],{type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
}

</script>

</body>
</html>
