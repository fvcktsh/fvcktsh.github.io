<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Grasshopper Web Engine</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family: ui-monospace, monospace;
  background:#0b0b0b;
  color:#fff;
}

#ui{
  display:grid;
  grid-template-columns:240px 1fr 300px;
  height:100vh;
}

/* LEFT */
#left{
  border-right:1px solid #222;
  padding:10px;
}

.nodeBtn{
  padding:8px;
  border:1px solid #333;
  margin-bottom:6px;
  cursor:pointer;
}
.nodeBtn:hover{ background:#111; }

/* CENTER */
#center{
  position:relative;
}

.node{
  position:absolute;
  width:140px;
  padding:10px;
  background:#111;
  border:1px solid #333;
  cursor:move;
}

/* RIGHT */
#right{
  border-left:1px solid #222;
  padding:10px;
}

button{
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#111;
  border:1px solid #333;
  color:#fff;
  cursor:pointer;
}

canvas{
  position:absolute;
  width:100%;
  height:100%;
}

</style>
</head>

<body>

<div id="ui">

<!-- LEFT NODE LIBRARY -->
<div id="left">

<div class="nodeBtn" onclick="addNode('GRID')">GRID</div>
<div class="nodeBtn" onclick="addNode('ATTRACTOR')">ATTRACTOR</div>
<div class="nodeBtn" onclick="addNode('EXTRUDE')">EXTRUDE</div>

<button onclick="compute()">COMPUTE</button>

</div>

<!-- CENTER GRAPH -->
<div id="center">
<canvas id="c"></canvas>
</div>

<!-- RIGHT EXPORT -->
<div id="right">

<h3>FABRICATION</h3>

<button onclick="exportDXF()">EXPORT DXF</button>
<button onclick="exportSVG()">EXPORT SVG</button>
<button onclick="exportSTL()">EXPORT STL</button>

</div>

</div>

<script>

/* =========================
   DATA SYSTEM
========================= */

let nodes = [];
let geometry = [];

/* =========================
   NODE CREATION
========================= */

function addNode(type){

  const n = document.createElement("div");
  n.className = "node";
  n.innerHTML = type;

  n.style.left = Math.random()*300+"px";
  n.style.top = Math.random()*200+"px";

  document.getElementById("center").appendChild(n);

  nodes.push({type, el:n});

  drag(n);
}

/* =========================
   DRAG SYSTEM
========================= */

function drag(el){

  let dx,dy,drag=false;

  el.onmousedown=(e)=>{
    drag=true;
    dx=e.offsetX;
    dy=e.offsetY;
  };

  document.onmousemove=(e)=>{
    if(drag){
      el.style.left=(e.pageX-dx)+"px";
      el.style.top=(e.pageY-dy)+"px";
    }
  };

  document.onmouseup=()=>drag=false;
}

/* =========================
   CORE COMPUTATION ENGINE
========================= */

function compute(){

  geometry = [];

  let size = 200;
  let density = 10;

  for(let x=0;x<size;x+=density){
    for(let y=0;y<size;y+=density){

      let px=x;
      let py=y;

      let cx=100, cy=100;

      let dx=cx-px;
      let dy=cy-py;

      let d=Math.sqrt(dx*dx+dy*dy);
      let f=80/(d+1);

      px += dx*f*0.02;
      py += dy*f*0.02;

      let pz = Math.sin(d*0.1)*15;

      geometry.push([px,py,pz]);
    }
  }

  render();
}

/* =========================
   RENDER
========================= */

function render(){

  const c=document.getElementById("c");
  const ctx=c.getContext("2d");

  c.width=window.innerWidth;
  c.height=window.innerHeight;

  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="#fff";

  geometry.forEach(p=>{
    ctx.fillRect(p[0],p[1],2,2);
  });
}

/* =========================
   DXF EXPORT (LASER / CNC)
========================= */

function exportDXF(){

  let dxf = "0\nSECTION\n2\nENTITIES\n";

  for(let i=0;i<geometry.length-1;i++){

    let a=geometry[i];
    let b=geometry[i+1];

    dxf += `
0
LINE
10 ${a[0]}
20 ${a[1]}
30 0
11 ${b[0]}
21 ${b[1]}
31 0
`;
  }

  dxf += "0\nENDSEC\n0\nEOF";

  download("fabrication.dxf", dxf);
}

/* =========================
   SVG EXPORT (LASER CUT 2D CLEAN)
========================= */

function exportSVG(){

  let svg = `<svg xmlns="http://www.w3.org/2000/svg">`;

  for(let i=0;i<geometry.length-1;i++){

    let a=geometry[i];
    let b=geometry[i+1];

    svg += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="black"/>`;
  }

  svg += `</svg>`;

  download("fabrication.svg", svg);
}

/* =========================
   STL EXPORT (3D PRINT)
========================= */

function exportSTL(){

  let stl = "solid grasshopper\n";

  geometry.forEach(p=>{

    stl += `
facet normal 0 0 1
outer loop
vertex ${p[0]} ${p[1]} ${p[2]}
vertex ${p[0]+1} ${p[1]} ${p[2]}
vertex ${p[0]} ${p[1]+1} ${p[2]}
endloop
endfacet
`;
  });

  stl += "endsolid";

  download("fabrication.stl", stl);
}

/* =========================
   DOWNLOAD SYSTEM
========================= */

function download(name,data){

  let b=new Blob([data],{type:"text/plain"});
  let u=URL.createObjectURL(b);

  let a=document.createElement("a");
  a.href=u;
  a.download=name;
  a.click();
}

</script>

</body>
</html>
