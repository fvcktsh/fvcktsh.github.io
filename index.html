<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parametric Design System</title>

<style>

/* =========================
   BASE — ENGINEERING STYLE
========================= */

body{
  margin:0;
  background:#0b0b0b;
  color:#eaeaea;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

/* =========================
   LAYOUT (LIKE SOFTWARE UI)
========================= */

.app{
  display:grid;
  grid-template-columns:260px 1fr 320px;
  height:100vh;
}

/* =========================
   LEFT — NODE LIBRARY
========================= */

.sidebar{
  border-right:1px solid #1a1a1a;
  padding:1.5rem;
}

.sidebar h1{
  font-size:12px;
  letter-spacing:0.3em;
  color:#888;
  margin-bottom:2rem;
}

.nodeItem{
  padding:8px;
  margin-bottom:6px;
  border:1px solid #1a1a1a;
  cursor:pointer;
  font-size:12px;
}

.nodeItem:hover{
  background:#111;
}

/* =========================
   CENTER — NODE CANVAS
========================= */

.canvas{
  position:relative;
  overflow:hidden;
  background:#0b0b0b;
}

.node{
  position:absolute;
  width:140px;
  padding:10px;
  border:1px solid #2a2a2a;
  background:#111;
  font-size:11px;
  cursor:move;
}

.nodeTitle{
  font-weight:bold;
  margin-bottom:6px;
}

.port{
  width:8px;
  height:8px;
  background:#888;
  border-radius:50%;
  position:absolute;
}

/* inputs / outputs */
.in{ left:-4px; top:50%; transform:translateY(-50%); }
.out{ right:-4px; top:50%; transform:translateY(-50%); }

/* =========================
   RIGHT — PARAMETERS PANEL
========================= */

.panel{
  border-left:1px solid #1a1a1a;
  padding:1.5rem;
}

.panel h2{
  font-size:12px;
  letter-spacing:0.3em;
  color:#888;
}

.param{
  margin-top:20px;
  font-size:11px;
}

input[type="range"]{
  width:100%;
}

/* =========================
   CONNECTION LINES
========================= */

svg{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

</style>

</head>

<body>

<div class="app">

<!-- LEFT -->
<div class="sidebar">

<h1>NODES</h1>

<div class="nodeItem" onclick="addNode('Geometry')">Geometry</div>
<div class="nodeItem" onclick="addNode('Divide Surface')">Divide Surface</div>
<div class="nodeItem" onclick="addNode('Attractor Field')">Attractor Field</div>
<div class="nodeItem" onclick="addNode('Extrude')">Extrude</div>
<div class="nodeItem" onclick="addNode('Simulation')">Simulation</div>

</div>

<!-- CENTER -->
<div class="canvas" id="canvas">

<svg id="svg"></svg>

</div>

<!-- RIGHT -->
<div class="panel">

<h2>PARAMETERS</h2>

<div class="param">
Density
<input type="range" min="1" max="100" value="50">
</div>

<div class="param">
Height
<input type="range" min="1" max="200" value="80">
</div>

</div>

</div>

<script>

/* =========================
   NODE SYSTEM (GRASSHOPPER STYLE)
========================= */

const canvas = document.getElementById("canvas");

let nodes = [];

function addNode(type){

  const node = document.createElement("div");
  node.className = "node";
  node.style.left = Math.random()*500 + "px";
  node.style.top = Math.random()*400 + "px";

  node.innerHTML = `
    <div class="nodeTitle">${type}</div>
    <div class="port in"></div>
    <div class="port out"></div>
  `;

  canvas.appendChild(node);
  nodes.push(node);

  makeDraggable(node);
}

/* =========================
   DRAG SYSTEM
========================= */

function makeDraggable(el){

  let offsetX, offsetY, dragging=false;

  el.onmousedown = (e)=>{
    dragging=true;
    offsetX = e.offsetX;
    offsetY = e.offsetY;
  };

  document.onmousemove = (e)=>{
    if(dragging){
      el.style.left = (e.pageX - offsetX) + "px";
      el.style.top = (e.pageY - offsetY) + "px";
    }
  };

  document.onmouseup = ()=>dragging=false;
}

/* =========================
   INIT EXAMPLE GRAPH
========================= */

addNode("Geometry");
addNode("Divide Surface");
addNode("Extrude");

</script>

</body>

</html>
