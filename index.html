<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Organizing Architectural Lab</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #050505;
  font-family: Arial;
}

#ui {
  position: fixed;
  top: 20px;
  left: 20px;
  color: #aaa;
  font-size: 12px;
  letter-spacing: 0.2em;
  z-index: 10;
}
</style>
</head>

<body>

<div id="ui">
SELF-ORGANIZING ARCHITECTURAL LAB
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 40, 220);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 25, 70);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* =========================
   LIGHT
========================= */

const light = new THREE.PointLight(0xffffff, 1);
light.position.set(50, 80, 50);
scene.add(light);

/* =========================
   ENTITIES (LAB SYSTEM)
========================= */

const nodes = [];

const types = ["project","research","system"];

function color(t){
  if(t==="project") return 0xffffff;
  if(t==="research") return 0x6666ff;
  return 0x66ff99;
}

/* =========================
   CREATE NODE
========================= */

function createNode(){

  const type = types[Math.floor(Math.random()*3)];

  const geo = new THREE.BoxGeometry(2, 2 + Math.random()*10, 2);
  const mat = new THREE.MeshStandardMaterial({ color: color(type) });

  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.set(
    (Math.random()-0.5)*160,
    Math.random()*20,
    (Math.random()-0.5)*160
  );

  mesh.userData = {
    type,
    vx:(Math.random()-0.5)*0.1,
    vz:(Math.random()-0.5)*0.1
  };

  scene.add(mesh);
  nodes.push(mesh);
}

/* =========================
   INITIAL SYSTEM
========================= */

for(let i=0;i<100;i++){
  createNode();
}

/* =========================
   SELF-ORGANIZATION RULES
========================= */

function organize(){

  for(let i=0;i<nodes.length;i++){

    let a = nodes[i];

    for(let j=i+1;j<nodes.length;j++){

      let b = nodes[j];

      let dx = a.position.x - b.position.x;
      let dz = a.position.z - b.position.z;

      let d = Math.sqrt(dx*dx + dz*dz);

      /* attraction rule (same type clusters) */
      if(a.userData.type === b.userData.type && d < 40){
        a.position.x -= dx*0.002;
        a.position.z -= dz*0.002;

        b.position.x += dx*0.002;
        b.position.z += dz*0.002;
      }

    }

    /* micro motion */
    a.position.x += a.userData.vx;
    a.position.z += a.userData.vz;

  }
}

/* =========================
   CAMERA CONTROL
========================= */

let keys = {};

document.addEventListener("keydown",(e)=>keys[e.key]=true);
document.addEventListener("keyup",(e)=>keys[e.key]=false);

function move(){

  if(keys["w"]) camera.position.z -= 0.5;
  if(keys["s"]) camera.position.z += 0.5;
  if(keys["a"]) camera.position.x -= 0.5;
  if(keys["d"]) camera.position.x += 0.5;

}

/* =========================
   LOOP
========================= */

function animate(){

  requestAnimationFrame(animate);

  move();
  organize();

  renderer.render(scene, camera);
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
