<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Full Fabrication Pipeline</title>

<style>

body{
  margin:0;
  font-family: monospace;
  background:#0b0b0b;
  color:#ddd;
}

/* =========================
   LAYOUT ENGINE
========================= */

#app{
  display:grid;
  grid-template-columns:260px 1fr 300px;
  height:100vh;
}

/* =========================
   NODE LIBRARY
========================= */

#left{
  border-right:1px solid #222;
  padding:10px;
}

.node{
  border:1px solid #333;
  padding:8px;
  margin-bottom:6px;
  cursor:pointer;
}

.node:hover{
  background:#111;
}

/* =========================
   WORKSPACE
========================= */

#center{
  position:relative;
  background:#0b0b0b;
}

canvas{
  width:100%;
  height:100%;
}

/* =========================
   PARAMETERS
========================= */

#right{
  border-left:1px solid #222;
  padding:10px;
}

input{
  width:100%;
}

button{
  margin-top:10px;
  width:100%;
  padding:8px;
  background:#111;
  color:#ddd;
  border:1px solid #333;
  cursor:pointer;
}

button:hover{
  background:#1a1a1a;
}

</style>

</head>

<body>

<div id="app">

<!-- LEFT NODE LIBRARY -->
<div id="left">

<div class="node" onclick="setMode('grid')">GRID</div>
<div class="node" onclick="setMode('attractor')">ATTRACTOR FIELD</div>
<div class="node" onclick="setMode('subdivision')">SUBDIVISION</div>
<div class="node" onclick="setMode('extrude')">EXTRUDE</div>

</div>

<!-- CENTER ENGINE -->
<div id="center">
<canvas id="c"></canvas>
</div>

<!-- RIGHT PARAMETERS -->
<div id="right">

<h3>PARAMETERS</h3>

Density
<input id="density" type="range" min="5" max="40" value="20">

Attraction
<input id="attraction" type="range" min="0" max="200" value="80">

Height
<input id="height" type="range" min="0" max="100" value="40">

<button onclick="generate()">GENERATE</button>
<button onclick="exportSVG()">EXPORT SVG</button>
<button onclick="export3D()">EXPORT 3D (OBJ)</button>

</div>

</div>

<script>

/* =========================
   CANVAS ENGINE
========================= */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* =========================
   STATE SYSTEM (NODE GRAPH SIMPLIFIED)
========================= */

let mode = "grid";

function setMode(m){
  mode = m;
}

/* =========================
   GEOMETRY DATA
========================= */

let points = [];

/* =========================
   GENERATION ENGINE
========================= */

function generate(){

  points = [];

  const d = +document.getElementById("density").value;
  const a = +document.getElementById("attraction").value;
  const h = +document.getElementById("height").value;

  const cx = canvas.width/2;
  const cy = canvas.height/2;

  for(let x=0;x<canvas.width;x+=d){
    for(let y=0;y<canvas.height;y+=d){

      let px = x;
      let py = y;

      if(mode === "attractor"){

        let dx = cx - px;
        let dy = cy - py;
        let dist = Math.sqrt(dx*dx+dy*dy);

        let f = a/(dist+1);

        px += dx*f*0.02;
        py += dy*f*0.02;
      }

      if(mode === "subdivision"){

        px += Math.sin(x*0.01)*5;
        py += Math.cos(y*0.01)*5;
      }

      points.push({x:px, y:py, z:h});
    }
  }

  draw();
}

/* =========================
   RENDER 2D FABRIC STRUCTURE
========================= */

function draw(){

  ctx.fillStyle = "#0b0b0b";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#ddd";

  points.forEach(p=>{
    ctx.fillRect(p.x,p.y,2,2);
  });

}

/* =========================
   EXPORT SVG (LASER / CNC)
========================= */

function exportSVG(){

  let svg = `<svg xmlns="http://www.w3.org/2000/svg">`;

  points.forEach(p=>{
    svg += `<rect x="${p.x}" y="${p.y}" width="1" height="1" fill="black"/>`;
  });

  svg += `</svg>`;

  download("fabrication.svg", svg);
}

/* =========================
   EXPORT 3D (SIMPLE OBJ)
========================= */

function export3D(){

  let obj = "";

  points.forEach(p=>{
    obj += `v ${p.x} ${p.y} ${p.z}\n`;
  });

  download("model.obj", obj);
}

/* =========================
   DOWNLOAD
========================= */

function download(name, data){
  const blob = new Blob([data], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
}

</script>

</body>
</html>
