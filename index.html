<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LIVE STUDIO DASHBOARD</title>

<style>
body{
  margin:0;
  font-family:ui-monospace, monospace;
  background:#0a0a0a;
  color:#fff;
}

#layout{
  display:grid;
  grid-template-columns:260px 1fr 300px;
  height:100vh;
}

/* LEFT */
#left{
  border-right:1px solid #222;
  padding:10px;
}

.repo{
  padding:8px;
  border:1px solid #333;
  margin-bottom:6px;
  cursor:pointer;
}

/* CENTER */
#center{
  position:relative;
}

/* GRAPH CANVAS */
canvas{
  position:absolute;
  width:100%;
  height:100%;
}

/* RIGHT */
#right{
  border-left:1px solid #222;
  padding:10px;
}

button{
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#111;
  color:#fff;
  border:1px solid #333;
}
</style>
</head>

<body>

<div id="layout">

<!-- LEFT: REPOS -->
<div id="left">
<h3>STUDIO</h3>
<div id="repos"></div>
</div>

<!-- CENTER: VISUAL SYSTEM -->
<div id="center">
<canvas id="canvas"></canvas>
</div>

<!-- RIGHT: CONTROL -->
<div id="right">

<h3>FABRICATION</h3>

<button onclick="generateGeometry()">GENERATE</button>
<button onclick="exportDXF()">DXF</button>
<button onclick="exportSTL()">STL</button>

</div>

</div>

<script>

/* =========================
   GITHUB DATA (SIMULATED)
========================= */

let studioState = {
  repos: [
    {name:"geometry-core", status:"active"},
    {name:"node-graph-engine", status:"active"},
    {name:"fabrication-compiler", status:"build"},
    {name:"research-atlas", status:"idle"}
  ]
};

/* =========================
   LOAD UI
========================= */

function loadRepos(){

  const container = document.getElementById("repos");

  studioState.repos.forEach(r=>{

    const div = document.createElement("div");
    div.className="repo";
    div.innerHTML = `${r.name}<br><small>${r.status}</small>`;

    container.appendChild(div);
  });
}

loadRepos();

/* =========================
   GEOMETRY SYSTEM
========================= */

let geometry = [];

function generateGeometry(){

  geometry = [];

  let size = 150;
  let density = 12;

  for(let x=0;x<size;x+=density){
    for(let y=0;y<size;y+=density){

      let dx = 75 - x;
      let dy = 75 - y;

      let d = Math.sqrt(dx*dx+dy*dy);
      let f = 80/(d+1);

      geometry.push([
        x + dx*f*0.02,
        y + dy*f*0.02,
        Math.sin(d*0.1)*10
      ]);
    }
  }

  render();
}

/* =========================
   VISUAL RENDER
========================= */

function render(){

  const c = document.getElementById("canvas");
  const ctx = c.getContext("2d");

  c.width = window.innerWidth;
  c.height = window.innerHeight;

  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="#fff";

  geometry.forEach(p=>{
    ctx.fillRect(p[0],p[1],2,2);
  });
}

/* =========================
   DXF EXPORT
========================= */

function exportDXF(){

  let dxf = "0\nSECTION\n2\nENTITIES\n";

  for(let i=0;i<geometry.length-1;i++){

    let a=geometry[i];
    let b=geometry[i+1];

    dxf += `
0
LINE
10 ${a[0]}
20 ${a[1]}
30 0
11 ${b[0]}
21 ${b[1]}
31 0
`;
  }

  dxf += "0\nENDSEC\n0\nEOF";

  download("studio.dxf", dxf);
}

/* =========================
   STL EXPORT
========================= */

function exportSTL(){

  let stl = "solid studio\n";

  geometry.forEach(p=>{

    stl += `
facet normal 0 0 1
outer loop
vertex ${p[0]} ${p[1]} ${p[2]}
vertex ${p[0]+1} ${p[1]} ${p[2]}
vertex ${p[0]} ${p[1]+1} ${p[2]}
endloop
endfacet
`;
  });

  stl += "endsolid";

  download("studio.stl", stl);
}

/* =========================
   DOWNLOAD
========================= */

function download(name,data){

  const blob = new Blob([data],{type:"text/plain"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
}

</script>

</body>
</html>
