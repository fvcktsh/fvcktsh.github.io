<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Studio OS v3 — Data Flow + 3D Engine</title>

<style>

/* =========================
   CORE UI (ENGINEERING STYLE)
========================= */

body{
  margin:0;
  overflow:hidden;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  background:#0b0b0b;
  color:#eaeaea;
}

/* =========================
   LAYOUT
========================= */

#app{
  display:grid;
  grid-template-columns:260px 1fr 320px;
  height:100vh;
}

/* =========================
   LEFT — NODE LIBRARY
========================= */

#left{
  border-right:1px solid #222;
  padding:10px;
}

.nodeBtn{
  padding:8px;
  border:1px solid #333;
  margin-bottom:6px;
  cursor:pointer;
}

.nodeBtn:hover{
  background:#111;
}

/* =========================
   CENTER — NODE GRAPH + 3D
========================= */

#center{
  position:relative;
}

/* node layer */
.node{
  position:absolute;
  width:140px;
  padding:10px;
  background:#111;
  border:1px solid #333;
  cursor:move;
  z-index:2;
}

/* WebGL canvas */
canvas{
  position:absolute;
  width:100%;
  height:100%;
  z-index:1;
}

/* =========================
   RIGHT — PARAMETERS
========================= */

#right{
  border-left:1px solid #222;
  padding:10px;
}

input, button{
  width:100%;
  margin-top:6px;
  padding:6px;
  background:#111;
  border:1px solid #333;
  color:#ddd;
}

/* =========================
   CABLES (DATA FLOW VISUAL)
========================= */

svg{
  position:absolute;
  width:100%;
  height:100%;
  z-index:3;
  pointer-events:none;
}

</style>
</head>

<body>

<div id="app">

<!-- LEFT -->
<div id="left">

<div class="nodeBtn" onclick="addNode('GRID')">GRID</div>
<div class="nodeBtn" onclick="addNode('ATTRACTOR')">ATTRACTOR</div>
<div class="nodeBtn" onclick="addNode('EXTRUDE')">EXTRUDE</div>
<div class="nodeBtn" onclick="compute()">COMPUTE</div>

</div>

<!-- CENTER -->
<div id="center">

<canvas id="gl"></canvas>
<svg id="cables"></svg>

</div>

<!-- RIGHT -->
<div id="right">

<h3>PARAMETERS</h3>

Density
<input id="density" type="range" min="5" max="30" value="15">

Force
<input id="force" type="range" min="0" max="200" value="80">

Height
<input id="height" type="range" min="0" max="50" value="20">

<h3>EXPORT</h3>

<button onclick="exportJSON()">EXPORT JSON</button>
<button onclick="exportOBJ()">EXPORT OBJ</button>

</div>

</div>

<script>

/* =========================
   NODE GRAPH SYSTEM (REAL DATA FLOW)
========================= */

let nodes = [];

function addNode(type){

  const n = document.createElement("div");
  n.className = "node";

  n.style.left = Math.random()*300 + "px";
  n.style.top = Math.random()*200 + "px";

  n.innerHTML = type;

  document.getElementById("center").appendChild(n);
  nodes.push({el:n,type:type,value:0});

  drag(n);
}

/* =========================
   DRAG
========================= */

function drag(el){

  let dx,dy,drag=false;

  el.onmousedown=(e)=>{
    drag=true;
    dx=e.offsetX;
    dy=e.offsetY;
  };

  document.onmousemove=(e)=>{
    if(drag){
      el.style.left=(e.pageX-dx)+"px";
      el.style.top=(e.pageY-dy)+"px";
    }
  };

  document.onmouseup=()=>drag=false;
}

/* =========================
   DATA FLOW ENGINE
========================= */

let field = [];

function compute(){

  field = [];

  const density = +document.getElementById("density").value;
  const force = +document.getElementById("force").value;
  const height = +document.getElementById("height").value;

  const size = 200;

  for(let x=0;x<size;x+=density){
    for(let y=0;y<size;y+=density){

      let px=x;
      let py=y;
      let pz=0;

      // ATTRACTOR LOGIC (DATA FLOW CORE)
      let cx=100, cy=100;

      let dx=cx-px;
      let dy=cy-py;

      let d=Math.sqrt(dx*dx+dy*dy);
      let f=force/(d+1);

      px+=dx*f*0.02;
      py+=dy*f*0.02;

      pz=height*Math.sin(d*0.1);

      field.push([px,py,pz]);
    }
  }

  render3D();
}

/* =========================
   3D ENGINE (WEBGL LIGHTWEIGHT)
========================= */

let gl,ctx;

const canvas=document.getElementById("gl");
gl=canvas.getContext("webgl");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

/* minimal fake render (points cloud style) */

function render3D(){

  const ctx2d = canvas.getContext("2d");
  ctx2d.clearRect(0,0,canvas.width,canvas.height);

  ctx2d.fillStyle="#fff";

  field.forEach(p=>{
    let x=p[0]*2;
    let y=p[1]*2;
    ctx2d.fillRect(x,y,2,2);
  });

}

/* =========================
   EXPORT SYSTEM (FABRICATION READY)
========================= */

function exportOBJ(){

  let obj="";

  field.forEach(p=>{
    obj+=`v ${p[0]} ${p[1]} ${p[2]}\n`;
  });

  download("model.obj",obj);
}

function exportJSON(){

  download("system.json",JSON.stringify(field));
}

function download(name,data){
  const b=new Blob([data],{type:"text/plain"});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");
  a.href=u;
  a.download=name;
  a.click();
}

</script>

</body>
</html>
