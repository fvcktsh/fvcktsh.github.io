<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Studio OS v4 — Architectural Machine</title>

<style>

/* =========================
   CORE SYSTEM UI
========================= */

body{
  margin:0;
  overflow:hidden;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  background:#0b0b0b;
  color:#eaeaea;
}

/* =========================
   LAYOUT
========================= */

#app{
  display:grid;
  grid-template-columns:260px 1fr 320px;
  height:100vh;
}

/* =========================
   LEFT — NODE LIBRARY
========================= */

#left{
  border-right:1px solid #222;
  padding:10px;
}

.nodeBtn{
  padding:8px;
  border:1px solid #333;
  margin-bottom:6px;
  cursor:pointer;
}

.nodeBtn:hover{
  background:#111;
}

/* =========================
   CENTER — GRAPH + 3D
========================= */

#center{
  position:relative;
  overflow:hidden;
}

/* node */
.node{
  position:absolute;
  width:140px;
  padding:10px;
  background:#111;
  border:1px solid #333;
  cursor:move;
  z-index:2;
}

/* canvas 3D */
canvas{
  position:absolute;
  width:100%;
  height:100%;
  z-index:1;
}

/* cables */
svg{
  position:absolute;
  width:100%;
  height:100%;
  z-index:3;
  pointer-events:none;
}

/* ports */
.port{
  width:8px;
  height:8px;
  background:#888;
  border-radius:50%;
  position:absolute;
}

/* =========================
   RIGHT PANEL
========================= */

#right{
  border-left:1px solid #222;
  padding:10px;
}

button, input{
  width:100%;
  margin-top:6px;
  padding:6px;
  background:#111;
  color:#ddd;
  border:1px solid #333;
}

</style>
</head>

<body>

<div id="app">

<!-- LEFT -->
<div id="left">

<div class="nodeBtn" onclick="addNode('GRID')">GRID</div>
<div class="nodeBtn" onclick="addNode('ATTRACTOR')">ATTRACTOR</div>
<div class="nodeBtn" onclick="addNode('SUBDIVIDE')">SUBDIVIDE</div>
<div class="nodeBtn" onclick="addNode('EXTRUDE')">EXTRUDE</div>

<button onclick="compute()">COMPUTE SYSTEM</button>

</div>

<!-- CENTER -->
<div id="center">

<canvas id="c"></canvas>
<svg id="cables"></svg>

</div>

<!-- RIGHT -->
<div id="right">

<h3>PARAMETERS</h3>

Density
<input id="density" type="range" min="5" max="30" value="15">

Force
<input id="force" type="range" min="0" max="200" value="90">

Height
<input id="height" type="range" min="0" max="80" value="30">

<h3>FABRICATION</h3>

<button onclick="exportDXF()">EXPORT DXF</button>
<button onclick="exportOBJ()">EXPORT OBJ</button>
<button onclick="exportJSON()">EXPORT JSON</button>

</div>

</div>

<script>

/* =========================
   NODE SYSTEM (REAL GRAPH)
========================= */

let nodes=[];
let edges=[];
let field=[];

function addNode(type){

  const n=document.createElement("div");
  n.className="node";

  n.style.left=Math.random()*300+"px";
  n.style.top=Math.random()*200+"px";

  n.innerHTML=`
    ${type}
    <div class="port"></div>
  `;

  document.getElementById("center").appendChild(n);
  nodes.push({el:n,type:type});

  drag(n);
}

/* =========================
   DRAG
========================= */

function drag(el){

  let dx,dy,drag=false;

  el.onmousedown=(e)=>{
    drag=true;
    dx=e.offsetX;
    dy=e.offsetY;
  };

  document.onmousemove=(e)=>{
    if(drag){
      el.style.left=(e.pageX-dx)+"px";
      el.style.top=(e.pageY-dy)+"px";
      drawEdges();
    }
  };

  document.onmouseup=()=>drag=false;
}

/* =========================
   NODE GRAPH EDGES (BASIC FLOW)
========================= */

function drawEdges(){

  const svg=document.getElementById("cables");
  svg.innerHTML="";

  for(let i=0;i<nodes.length-1;i++){

    let a=nodes[i].el.getBoundingClientRect();
    let b=nodes[i+1].el.getBoundingClientRect();

    let path=document.createElementNS("http://www.w3.org/2000/svg","path");

    let d=`M ${a.left} ${a.top} C ${(a.left+b.left)/2} ${a.top}, ${(a.left+b.left)/2} ${b.top}, ${b.left} ${b.top}`;

    path.setAttribute("d",d);
    path.setAttribute("stroke","#555");
    path.setAttribute("fill","none");

    svg.appendChild(path);
  }
}

/* =========================
   COMPUTATION ENGINE (ARCHITECTURAL LOGIC)
========================= */

function compute(){

  field=[];

  const density=+document.getElementById("density").value;
  const force=+document.getElementById("force").value;
  const height=+document.getElementById("height").value;

  const size=200;

  for(let x=0;x<size;x+=density){
    for(let y=0;y<size;y+=density){

      let px=x;
      let py=y;

      let cx=100,cy=100;

      let dx=cx-px;
      let dy=cy-py;

      let d=Math.sqrt(dx*dx+dy*dy);
      let f=force/(d+1);

      px+=dx*f*0.02;
      py+=dy*f*0.02;

      let pz=height*Math.sin(d*0.1);

      field.push({x:px,y:py,z:pz});
    }
  }

  render();
}

/* =========================
   3D MESH ENGINE (LIGHTWEIGHT)
========================= */

function render(){

  const c=document.getElementById("c");
  const ctx=c.getContext("2d");

  c.width=window.innerWidth;
  c.height=window.innerHeight;

  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="#ddd";

  field.forEach(p=>{
    ctx.fillRect(p.x,p.y,2,2);
  });

}

/* =========================
   FABRICATION EXPORT
========================= */

function exportDXF(){

  let data="DXF\n";

  field.forEach(p=>{
    data+=`POINT ${p.x},${p.y},${p.z}\n`;
  });

  download("model.dxf.txt",data);
}

function exportOBJ(){

  let obj="";

  field.forEach(p=>{
    obj+=`v ${p.x} ${p.y} ${p.z}\n`;
  });

  download("model.obj",obj);
}

function exportJSON(){
  download("model.json",JSON.stringify(field));
}

/* =========================
   DOWNLOAD
========================= */

function download(n,d){
  let b=new Blob([d],{type:"text/plain"});
  let u=URL.createObjectURL(b);
  let a=document.createElement("a");
  a.href=u;
  a.download=n;
  a.click();
}

</script>

</body>
</html>
